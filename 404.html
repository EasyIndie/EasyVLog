<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6f4f">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>页面不存在 · 毕业生食谱</title>
  <link rel="icon" href="/EasyVLog/assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="/EasyVLog/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/EasyVLog/assets/apple-touch-icon.png">
  <style>
    :root {
      --accent: #2f6f4f; --bg: #f6f5f2; --surface: #fff;
      --ink: #201e1b; --ink-2: #4a453e; --muted: #7b756b; --line: #e7e3db;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #5fbf8d; --bg: #14171a; --surface: #1c2024;
        --ink: #e9e7e2; --ink-2: #c3beb5; --muted: #8d949c; --line: #2b3137;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink); padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      line-height: 1.75;
    }
    .card {
      width: 100%; max-width: 440px; text-align: center;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 18px; padding: 40px 28px;
      box-shadow: 0 10px 40px -22px rgba(0, 0, 0, .35);
    }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 18px;
      display: grid; place-items: center;
      background: var(--accent); color: #fff;
      border-radius: 15px; font-size: 28px; font-weight: 700;
    }
    h1 { margin: 0 0 8px; font-size: 21px; letter-spacing: .01em; }
    p { margin: 0 0 24px; color: var(--muted); font-size: 14.5px; }
    a.btn {
      display: inline-block; padding: 10px 22px; border-radius: 10px;
      background: var(--accent); color: #fff; text-decoration: none;
      font-size: 15px; font-weight: 600;
    }
    a.btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">食</div>
    <h1>这一页不存在</h1>
    <p>链接可能已经改了，或者地址打错了。</p>
    <a class="btn" href="/EasyVLog/">回到食谱首页</a>
  </main>
</body>
</html>
