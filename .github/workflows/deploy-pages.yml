name: 构建并部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 重新生成索引与站点导航
        run: |
          node scripts/build-recipes.mjs
          node scripts/build-index.mjs
          node scripts/build-site.mjs

      - name: 组装站点产物
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html site.json _site/
          if [ -f .nojekyll ]; then cp .nojekyll _site/; fi
          cp -R assets _site/
          if [ -f README.md ]; then cp README.md _site/; fi
          for d in 01-* 02-* 03-* 04-* 05-*; do
            if [ -d "$d" ]; then cp -R "$d" _site/; fi
          done
          # 模板文件不进站点
          find _site -name '_模板.md' -delete
          find _site -name '_template.md' -delete
          echo "站点文件："
          find _site -type f | sort

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
