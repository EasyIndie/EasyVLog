name: 构建并部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 重新生成索引与站点导航
        run: |
          node scripts/build-recipes.mjs
          node scripts/build-index.mjs
          node scripts/build-site.mjs

      - name: 静态化并组装站点
        run: node scripts/build-static.mjs --base /easyvlog/ --out _site

      - name: 压缩 CSS / JS（失败不影响发布）
        continue-on-error: true
        run: |
          min() {
            npx --yes esbuild@0.24.0 "$1" --minify --outfile="$2" && mv "$2" "$1"
          }
          min _site/assets/style.css /tmp/style.min.css || echo "CSS 压缩跳过"
          min _site/assets/app.js /tmp/app.min.js || echo "JS 压缩跳过"
          min _site/assets/theme-init.js /tmp/theme.min.js || echo "theme-init 压缩跳过"
          echo "体积："
          ls -l _site/assets | awk '{print $5, $9}'

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
