<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6f4f">
  <meta name="description" content="毕业生食谱 · 私人食谱库与面食脚本">
  <title>毕业生食谱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f6f4f'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif'%3E食%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#content">跳到正文</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">食</span>
      <span class="brand-text">
        <span class="brand-name">毕业生食谱</span>
        <span id="docTitle" class="brand-sub">私人食谱库</span>
      </span>
    </div>
    <div class="actions">
      <button id="wakeBtn" class="icon-btn" aria-label="屏幕常亮" aria-pressed="false" title="屏幕常亮" hidden>☀</button>
      <button id="themeBtn" class="icon-btn" aria-label="切换深色模式" title="深浅色">◐</button>
      <button id="printBtn" class="icon-btn" aria-label="打印本篇" title="打印">⎙</button>
    </div>
  </header>
  <div id="progress" aria-hidden="true"><span></span></div>

  <div class="layout">
    <aside id="sidebar" aria-label="目录">
      <div class="sidebar-inner">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sidebar-head">
          <label class="search-wrap">
            <span aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="搜索食谱 / 脚本…" autocomplete="off">
          </label>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-foot">
          <span class="vision-mark" aria-hidden="true">🎯</span>
          <div class="vision">
            <div class="vision-title">认真做饭，认真生活</div>
            <div class="vision-sub">把家常面食一样一样做明白</div>
          </div>
        </div>
      </div>
    </aside>
    <div id="backdrop"></div>

    <main id="content">
      <div class="skeleton">
        <div class="sk-line sk-60"></div>
        <div class="sk-line sk-90"></div>
        <div class="sk-line sk-80"></div>
      </div>
    </main>
  </div>

  <nav class="tabbar" aria-label="主导航">
    <button class="tab" type="button" data-action="nav">
      <span class="tab-ico" aria-hidden="true">🗂</span><span class="tab-txt">目录</span>
    </button>
    <button class="tab" type="button" data-action="today">
      <span class="tab-ico" aria-hidden="true">🔪</span><span class="tab-txt">今日</span>
    </button>
    <span class="tab-slot" aria-hidden="true"></span>
    <button class="tab" type="button" data-action="recipes">
      <span class="tab-ico" aria-hidden="true">📖</span><span class="tab-txt">食谱</span>
    </button>
    <button class="tab" type="button" data-action="scripts">
      <span class="tab-ico" aria-hidden="true">📝</span><span class="tab-txt">脚本</span>
    </button>
  </nav>

  <button id="timerFab" class="timer-fab" type="button" aria-label="计时器">
    <span class="fab-ico" aria-hidden="true">⏱</span>
    <span id="timerFabTime" class="fab-time"></span>
  </button>
  <div id="timerBackdrop" class="timer-backdrop"></div>
  <section id="timerPanel" class="timer-panel" aria-label="计时器" aria-hidden="true">
    <div class="tp-head">
      <span class="tp-title">计时器</span>
      <button id="timerClose" class="tp-close" type="button" aria-label="关闭">×</button>
    </div>
    <div id="timerList" class="tp-list"></div>
    <div class="tp-add">
      <div class="tp-presets">
        <button type="button" data-min="1">1 分</button>
        <button type="button" data-min="3">3 分</button>
        <button type="button" data-min="5">5 分</button>
        <button type="button" data-min="10">10 分</button>
        <button type="button" data-min="15">15 分</button>
        <button type="button" data-min="30">30 分</button>
      </div>
      <div class="tp-custom">
        <input id="timerInput" type="number" inputmode="numeric" min="1" max="600" placeholder="自定义（分钟）">
        <button id="timerAddBtn" type="button">添加</button>
      </div>
    </div>
  </section>

  <button id="toTop" class="to-top" aria-label="回到顶部" title="回到顶部">↑</button>

  <script src="assets/marked.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
